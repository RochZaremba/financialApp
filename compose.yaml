services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dom
      POSTGRES_USER: dom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dom -d dom"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
