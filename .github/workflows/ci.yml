name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - name: Set up isolated development database
        run: ./scripts/setup.sh
      - name: Lint, typecheck, build, migrations, unit/API/E2E and visual checks
        env:
          WEBKIT: '1'
          PLAYWRIGHT_DOCKER: '1'
          REVIEW_PASS: github-ci
        run: ./scripts/check.sh
      - name: Browser and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            artifacts/ui-review/
            artifacts/playwright-report/
            artifacts/e2e-results/
            artifacts/check-server.log
          if-no-files-found: ignore
